<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }}</title>
    <link rel="icon" type="image/x-icon" href="/assets/icons/favicon.ico">
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.bunny.net">
    <link rel="stylesheet" href="https://fonts.bunny.net/css?family=EB+Garamond:400,500,700,400i,500i,700i|Roboto+Condensed:400,500,700,400i,500i,700i&display=swap">
    <link rel="stylesheet" href="/style.css">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="/feed.xml">
    {% if page.scripts and page.scripts.size > 0 %}
      {% for script in page.scripts %}
        <script src="{{ script }}" defer></script>
      {% endfor %}
    {% endif %}
    {% include schema.html %}
  </head>
  <body>
    <nav class="navigation_container">
      <span class="navigation_bar">
        <a href="/">Hem</a>
        <a href="/arkiv.html">Arkiv</a>
        <a href="/om.html">Om</a>
        <a href="/in_english.html">In English</a>
      </span>
      <span class="social_bar_header">
        {% include social_icons.html %}
      </span>
    </nav>
    <div id="page_wrapper">
      <header>
        <h1>Svenska fjällklätter&shy;projektet</h1>
      </header>
      <main>
      {{ content }}
      </main>
      <footer>
        <span class="social_bar_footer">
          {% include social_icons.html %}
        </span>
      </footer>
    </div>
  </body>
</html>
